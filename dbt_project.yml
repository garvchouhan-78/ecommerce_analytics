name: 'ecommerce_analytics'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_analytics:

    staging:
      +materialized: view

    intermediate:
      +materialized: ephemeral

    marts:
      +materialized: table

      +post-hook:
        - "GRANT SELECT ON {{ this }} TO ROLE analytics_readonly"

vars:
  payment_methods:
    - credit_card
    - debit_card
    - paypal
    - bank_transfer

seeds:
  ecommerce_analytics:
    +generate_database_name: ECOMMERCE_DB
    +generate_schema_name: RAW
    +database: ECOMMERCE_DB
    +schema: RAW
