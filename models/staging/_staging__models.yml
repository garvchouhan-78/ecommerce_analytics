version: 2

models:

  - name: stg_customers
    description: "Cleaned customer data"

    columns:

      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: "Cleaned order data"

    columns:

      - name: order_id
        description: "Unique order identifier"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Customer associated with the order"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: status
        description: "Order status"
        tests:
          - not_null
          - accepted_values:
              values:
                - completed
                - pending
                - cancelled

      - name: total_amount
        description: "Order amount"
        tests:
          - not_null
          - test_non_negative

  - name: stg_payments
    description: "Cleaned payment data"

    columns:

      - name: payment_id
        description: "Unique payment identifier"
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Order associated with the payment"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: payment_method
        description: "Payment method"
        tests:
          - not_null
          - accepted_values:
              values:
                - credit_card
                - wallet
                - upi
                - net_banking
                - debit_card

      - name: payment_status
        description: "Payment status"
        tests:
          - not_null
          - accepted_values:
              values:
                - completed
                - pending