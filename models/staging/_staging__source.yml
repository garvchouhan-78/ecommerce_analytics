version: 2

sources:
  - name: ecommerce
    database: ECOMMERCE_DB
    schema: RAW

    tables:

      - name: RAW_CUSTOMERS
        description: "Raw customer records."

      - name: RAW_ORDERS
        description: "Raw order records."
        loaded_at_field: updated_at

        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour

      - name: RAW_PAYMENTS
        description: "Raw payment records."
        loaded_at_field: updated_at

        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour